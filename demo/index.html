<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS · Demo</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css?v=4">
<link rel="stylesheet" href="extras.css?v=3">
<link rel="stylesheet" href="control.css?v=2">
<link rel="stylesheet" href="auto.css?v=4">

<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#/">
      <img class="brand-mark" src="logo.png" alt="" width="30" height="30">
      <span class="brand-name">ATLAS</span>
      <span class="brand-sub">alle Projekte</span>
    </a>
    <button class="search-trigger" id="openSearch" type="button">
      <svg class="i"><use href="#i-search"/></svg>
      <span>Projekte, Dateien, Code durchsuchen…</span>
      <kbd>Ctrl K</kbd>
    </button>
    <div class="top-actions">
      <a class="sys-pill" id="sysPill" href="#/system" title="Systemauslastung (Details)"></a>
      <div class="scan-box"><button class="scan-pill" id="scanBtn" type="button" title="Alles neu scannen"></button></div>
      <button class="btn-new" id="newBtn" type="button"><svg class="i"><use href="#i-plus"/></svg><span>Neu</span></button>
      <button class="theme-btn" id="themeBtn" type="button" title="Hell / Dunkel (T)" aria-label="Hell / Dunkel"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="look-btn" id="lookBtn" type="button" title="Darstellung: Farben, Banner, Grösse (,)" aria-label="Darstellung"><svg class="i"><use href="#i-palette"/></svg></button>
    </div>
  </header>
  <aside class="side" id="side"></aside>
  <main class="main" id="main"><div class="loading">Lade Projekte…</div></main>
</div>

<div class="overlay" id="palette" hidden>
  <div class="palette" role="dialog" aria-label="Suche">
    <div class="palette-input">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="paletteInput" placeholder="Suche nach Projekt, Technologie, Datei…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="palette-results" id="paletteResults"></div>
  </div>
</div>

<div class="overlay" id="modal" hidden><div class="modal" id="modalBox"></div></div>
<div class="toasts" id="toasts"></div>
<div class="lightbox" id="lightbox" hidden>
  <div class="lb-top"><span id="lbTitle"></span><span id="lbCount"></span>
    <button class="icon-btn" id="lbClose" title="Schliessen (Esc)"><svg class="i"><use href="#i-x"/></svg></button></div>
  <button class="lb-nav prev" id="lbPrev" title="Zurück (←)"><svg class="i"><use href="#i-left"/></svg></button>
  <div class="lb-stage" id="lbStage"></div>
  <button class="lb-nav next" id="lbNext" title="Weiter (→)"><svg class="i"><use href="#i-chev"/></svg></button>
  <div class="lb-strip" id="lbStrip"></div>
</div>
